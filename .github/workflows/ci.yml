name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  setup-compatibility:
    name: Setup compatibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,ai]"
      - run: ruff check app/setup.py tests/test_setup.py tests/test_installers.py
      - run: pytest -q tests/test_setup.py tests/test_installers.py
      - name: POSIX installer syntax
        if: runner.os != 'Windows'
        run: sh -n install-trading-agent.sh install.sh
      - name: macOS installer syntax
        if: runner.os == 'macOS'
        run: zsh -n install-trading-agent.command install.command
      - name: PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Files = @("install-trading-agent.ps1", "install.ps1")
          foreach ($File in $Files) {
            $null = [scriptblock]::Create((Get-Content -Raw $File))
          }

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: trading_agent
          POSTGRES_USER: trading
          POSTGRES_PASSWORD: trading
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trading -d trading_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://trading:trading@localhost:5432/trading_agent
      MODEL_PROVIDER: openai
      OPENAI_API_KEY: test-only-not-a-real-key
      DATABASE_AUTO_MIGRATE: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,ai]"
      - name: Static and security lint
        run: |
          ruff check .
          ruff check --select S app
      - name: Database migration
        run: |
          alembic upgrade head
          alembic check
      - name: Tests
        run: pytest -q
      - name: Build and inspect wheel
        run: |
          python -m pip install build
          python -m build
          python -m zipfile --list dist/*.whl | grep "app/migrations/versions"
      - name: Dependency vulnerability audit
        run: |
          python -m pip install pip-audit
          pip-audit
