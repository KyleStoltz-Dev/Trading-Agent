name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: trading_agent
          POSTGRES_USER: trading
          POSTGRES_PASSWORD: trading
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trading -d trading_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://trading:trading@localhost:5432/trading_agent
      MODEL_PROVIDER: openai
      OPENAI_API_KEY: test-only-not-a-real-key
      DATABASE_AUTO_MIGRATE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Static and security lint
        run: |
          ruff check .
          ruff check --select S app
      - name: Database migration
        run: |
          alembic upgrade head
          alembic check
      - name: Tests
        run: pytest -q
      - name: Build and inspect wheel
        run: |
          python -m pip install build
          python -m build
          python -m zipfile --list dist/*.whl | grep "app/migrations/versions"
      - name: Dependency vulnerability audit
        run: |
          python -m pip install pip-audit
          pip-audit
