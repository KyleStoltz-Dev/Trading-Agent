[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trading-agent"
version = "0.1.0"
description = "Human-in-the-loop trading copilot for playbook analysis and journaling."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "rich>=14,<15",
  "sqlalchemy>=2.0,<3",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
trading-agent = "app.cli:run"

[project.optional-dependencies]
openai = [
  "openai>=1.99,<3",
]
anthropic = [
  "anthropic>=0.75,<1",
]
ai = [
  "openai>=1.99,<3",
  "anthropic>=0.75,<1",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
