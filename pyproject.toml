[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "trading-agent"
version = "0.1.0"
description = "Human-in-the-loop trading copilot for playbook analysis and journaling."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.115,<1",
  "filelock>=3.18,<4",
  "httpx>=0.28,<1",
  "keyring>=25.6,<26",
  "psycopg[binary]>=3.2,<4",
  "psutil>=7,<8",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "rich>=14,<16",
  "sqlalchemy>=2.0,<3",
  "tzdata>=2025.2",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
trading-agent = "app.cli:run"
trade = "app.cli:run"
trading-agent-mt5-bridge = "app.metatrader_bridge_server:run"

[project.urls]
Repository = "https://github.com/KyleStoltz-Dev/Trading-Agent"
Issues = "https://github.com/KyleStoltz-Dev/Trading-Agent/issues"

[project.optional-dependencies]
openai = [
  "openai>=1.99,<3",
]
anthropic = [
  "anthropic>=0.75,<1",
]
ai = [
  "openai>=1.99,<3",
  "anthropic>=0.75,<1",
]
metatrader = [
  "MetaTrader5>=5.0; sys_platform == 'win32'",
]
dev = [
  "pytest>=9.0.3,<10",
  "ruff>=0.11,<1",
]

[dependency-groups]
release = [
  "editables==0.6",
  "hatchling==1.31.0",
  "pip-audit==2.10.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
exclude = [
  "**/__pycache__",
  "**/*.pyc",
  "**/*.pyo",
]

[tool.hatch.build.targets.sdist]
include = [
  "/.devcontainer",
  "/.dockerignore",
  "/.env.example",
  "/AGENTS.md",
  "/README.md",
  "/alembic.ini",
  "/app",
  "/docker-compose.yml",
  "/docs",
  "/examples",
  "/install-trading-agent.command",
  "/install-trading-agent.ps1",
  "/install-trading-agent.sh",
  "/install.command",
  "/install.ps1",
  "/install.sh",
  "/requirements-bootstrap.txt",
  "/scripts",
  "/tests",
  "/uv.lock",
]
exclude = [
  "/.data",
  "/.env",
  "/.git",
  "/.pytest_cache",
  "/.ruff_cache",
  "/.venv",
  "/dist",
  "**/__pycache__",
  "**/*.pyc",
  "**/*.pyo",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
